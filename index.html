<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG</h1>
        <div class="score-container">
            <div class="score">
                <span>Player</span>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <span>AI</span>
                <p id="aiScore">0</p>
            </div>
        </div>
        <canvas id="pongCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <p id="instructions">Move your paddle by touching/moving left or right side of the screen</p>
            <button id="startBtn">Start Game</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
